# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    fintrust.mailer_from: '%env(string:FINTRUST_SMTP_FROM)%'
    fintrust.login_url: '%env(string:FINTRUST_LOGIN_URL)%'
    docraptor_api_key: '%env(DOCRAPTOR_API_KEY)%'
    test_user_email: '%env(TEST_USER_EMAIL)%'
    openRouterKey: '%env(OPENROUTER_API_KEY)%'
    fintrust.public_url: '%env(string:FINTRUST_PUBLIC_URL)%'
    openai.api_key: '%env(string:OPENAI_API_KEY)%'
    openai.moderation_model: '%env(string:OPENAI_MODERATION_MODEL)%'
    twilio.account_sid: '%env(TWILIO_ACCOUNT_SID)%'
    twilio.auth_token: '%env(TWILIO_AUTH_TOKEN)%'
    twilio.from: '%env(TWILIO_VERIFY_SERVICE_SID)%'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $appSecret: '%kernel.secret%'
            string $kernelEnvironment: '%kernel.environment%'
            string $firstMailerFrom: '%fintrust.mailer_from%'
            string $firstLoginUrl: '%fintrust.login_url%'
            string $apiKey: '%docraptor_api_key%'
            string $testUserEmail: '%test_user_email%'
            string $openRouterKey: '%openRouterKey%'
            string $firstPublicUrl: '%fintrust.public_url%'
            string $openAiApiKey: '%openai.api_key%'
            string $openAiModerationModel: '%openai.moderation_model%'
            string $twilioSid: '%twilio.account_sid%'
            string $twilioAuthToken: '%twilio.auth_token%'
            string $twilioFrom: '%twilio.from%'
            string $exchangeRateApiKey: '%env(EXCHANGE_RATE_API_KEY)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Twig\AlertExtension:
        tags: ['twig.extension']
